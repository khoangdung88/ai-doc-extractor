name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      - name: Ruff lint
        run: uv run ruff check . --output-format=github
      - name: Ruff format
        run: uv run ruff format . --check
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest --cov=docext --cov-report=term-missing -m "not integration"

  agent-rules-guard:
    name: architecture guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No vendor SDK imports outside providers
        run: |
          set -e
          if grep -rnE "^\s*(import|from) (openai|anthropic|google\.genai|ollama)" src/docext --include=*.py | grep -v "src/docext/extraction/providers/"; then
            echo "::error::Vendor SDK imported outside extraction/providers/ (see .agent/rules/30-ai-models.md)"; exit 1; fi
      - name: No upward imports (core must not import docext.*)
        run: |
          set -e
          if grep -rnE "from docext\.(domain|ingestion|extraction|api|cli)" src/docext/core; then
            echo "::error::core/ imports a higher layer (see .agent/rules/10-architecture.md)"; exit 1; fi
          if grep -rnE "from docext\.(extraction|api|cli)" src/docext/domain src/docext/ingestion; then
            echo "::error::domain/ingestion import a higher layer"; exit 1; fi
          if grep -rnE "from docext\.(api|cli)" src/docext/extraction; then
            echo "::error::extraction imports api/cli"; exit 1; fi
      - name: No os.environ outside core/config
        run: |
          set -e
          if grep -rn "os.environ" src/docext --include=*.py | grep -v "src/docext/core/config.py"; then
            echo "::error::Read config via core.config.Settings only"; exit 1; fi
      - name: Feature PRs must touch docs/features or docs/adr
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'feat')
        run: |
          # HEAD is the PR merge commit on a shallow clone, so diff two-dot against the fetched base
          # (three-dot needs a merge base that --depth=1 does not have).
          git fetch origin ${{ github.base_ref }} --depth=1
          if ! git diff --name-only FETCH_HEAD HEAD | grep -qE "^docs/(features|adr)/"; then
            echo "::error::feat PR without a spec/ADR change (see .agent/workflows/new-feature.md)"; exit 1; fi
