name: Feature request
description: A new capability or behavior change
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What is missing or wrong today and for whom? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: What should happen? Example request/response if relevant. }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Out of scope }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [domain (document types), extraction (pipeline/prompts), providers (AI models), ingestion (input formats), api/cli, docs/agent-rules, other]
    validations: { required: true }
