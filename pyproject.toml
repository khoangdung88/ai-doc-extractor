[project]
name = "docext"
version = "0.1.0"
description = "AI-powered extraction of structured data from shipping documents (invoice, packing list, booking confirmation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pymupdf>=1.24,<2",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
]

[project.scripts]
docext = "docext.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.14",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docext"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH", "RUF", "PL"]
# TC*: pydantic needs runtime imports; PLC0415: lazy imports are deliberate (heavy/optional deps)
ignore = ["PLR2004", "PLR0913", "TC001", "TC002", "TC003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["docext"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "fitz", "fitz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that call real external services (skipped in CI unless keys are set)",
]
